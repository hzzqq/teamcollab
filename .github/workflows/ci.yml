# TeamCollab CI：push/PR 自动回归
# - backend：PostgreSQL(pgvector) + Redis service 容器 → alembic 迁移 → pytest 全量 → 真实起服跑 API e2e
#   （REDIS_URL 注入后 broker/限流/调度器全走多实例模式，等价于生产 Redis 部署形态的回归）
# - frontend：npm ci → tsc 类型检查 → next build
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab
          POSTGRES_DB: collab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collab -d collab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://collab:collab@localhost:5432/collab
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Run pytest
        run: python -m pytest tests -q

      - name: API e2e smoke（真实起服，含 SSE/CORS/RBAC 链路）
        env:
          # 与 conftest 同思路：放开限流避免冒烟被 429 干扰
          RATE_LIMIT_AUTH_PER_MINUTE: "100000"
          RATE_LIMIT_GENERAL_PER_MINUTE: "1000000"
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          UVICORN_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/openapi.json > /dev/null; then break; fi
            sleep 1
          done
          python scripts/e2e_smoke.py
          kill $UVICORN_PID

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        env:
          # 与本地 .env.production（未入库）等价：生产模式走 real API
          NEXT_PUBLIC_API_MODE: real
        run: npm run build
