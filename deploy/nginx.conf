# TeamCollab 生产反代
# - /api/* → API 双实例轮询（多实例模式：REDIS_URL 必配）
# - SSE：/api/ 全局禁缓冲 + 长读超时（EventSource 长连接不断流）
# - /*   → Next.js web

upstream api_backend {
    server api-1:8000;
    server api-2:8000;
}

upstream web_backend {
    server web:3000;
}

# 通用 API 日志格式：只记录 $uri（不含 query string），避免把 URL 上的
# 敏感参数（如 SSE 的 access token）写进访问日志。
log_format api_safe '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/api_access.log api_safe;

    # API（含 SSE 流：notifications/stream 为同源长连接）
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 关键：禁缓冲 + 长超时，避免代理吞流/断连
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SSE 通知流：access token 通过 query 传递（EventSource 无法自定义 Header），
    # 因此该路径关闭访问日志，避免明文 token 落盘；错误日志保留 $uri 不含 query。
    location = /api/v1/notifications/stream {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        access_log off;
        error_log /var/log/nginx/sse_error.log warn;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 前端
    location / {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
