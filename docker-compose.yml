services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: collab-postgres
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports:
      - "5432:5432"
    volumes:
      - collab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SSE 多实例模式（uvicorn 起多个进程时必配）：REDIS_URL=redis://localhost:6379/0
  redis:
    image: redis:7-alpine
    container_name: collab-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  collab_pgdata:
