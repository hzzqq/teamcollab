services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: collab-postgres
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports:
      - "5432:5432"
    volumes:
      - collab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  collab_pgdata:
